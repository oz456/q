[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "q-cli"
version = "0.1.0"
description = "A fast, streaming, multi-provider terminal AI chat client inspired by tgpt."
readme = "README.md"
authors = [
    { name = "Student Developer" }
]
requires-python = ">=3.8"
dependencies = [
    "requests>=2.28.0",
    "rich>=13.0.0"
]

[project.scripts]
q = "q.cli:main"
